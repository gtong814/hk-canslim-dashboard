name: Daily HK CAN SLIM Scan

on:
  schedule:
    - cron: '45 8 * * 1-5'   # 逢週一至五 16:45 HKT 執行
  workflow_dispatch:          # 允許在 GitHub 網頁手動即時執行

permissions:
  contents: write             # 允許自動 Commit 更新 CSV

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CAN SLIM Scanner
        run: python scan_canslim.py

      - name: Commit updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
         git add canslim_hk.csv market_status.json ggt_universe.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update HK CAN SLIM data"
          git push
