name: Daily HK CAN SLIM Scan

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CAN SLIM Scanner
        run: python scan_canslim.py

      - name: Commit updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add canslim_hk.csv market_status.json ggt_universe.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update HK CAN SLIM data"
          git push
